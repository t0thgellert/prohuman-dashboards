name: Adatok frissítése

on:
  schedule:
    - cron: "0 * * * *"   # Minden óra elején
  workflow_dispatch:        # Kézi futtatás is lehetséges a GitHub felületéről

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Szükséges a commithoz

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Függőségek telepítése
        run: pip install requests

      - name: Adatok lekérése és HTML generálása
        env:
          AC_API_URL: ${{ secrets.AC_API_URL }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
        run: python fetch_data.py

      - name: Változások commitálása
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.html
          # Csak akkor commitál, ha tényleg változott valami
          git diff --staged --quiet || git commit -m "Automatikus frissítés: $(date +'%Y-%m-%d %H:%M') UTC"
          git push
